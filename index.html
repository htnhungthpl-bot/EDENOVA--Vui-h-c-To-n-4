    <script>
      // Compatibility shim for browser extensions and request interceptors
      // preventing "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _fetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          console.warn('Fetch setter initialization:', err);
        }
      })();
    </script>
